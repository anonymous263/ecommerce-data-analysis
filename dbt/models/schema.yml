version: 2

# =============================================================================
# Phase 2 tests — staging (woocommerce) + core marts.
# PK uniqueness/not_null, FK relationships (fact -> dim), accepted_values on
# enums, and expression tests (revenue >= 0, quantity > 0) via dbt_utils /
# dbt_expectations. All tests must pass under `dbt build`.
# =============================================================================

models:
  # ------------------------------------------------------------------ staging
  - name: stg_woo_orders
    description: Typed order headers; PII hashed, money in source currency.
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: source('raw', 'woo_orders')
    columns:
      - name: order_natural_key
        tests: [unique, not_null]
      - name: woo_order_id
        tests: [not_null]
      - name: customer_hash
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              values: [completed, processing, cancelled, failed, refunded, pending]
      - name: currency_source
        tests:
          - not_null
          - accepted_values:
              values: [USD, EUR, GBP, CAD]

  - name: stg_woo_order_items
    description: Typed line items with cleaned variant attributes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [site_code, woo_order_id, woo_order_item_id]
    columns:
      - name: woo_order_item_id
        tests: [not_null]
      - name: quantity
        tests: [not_null]

  - name: stg_woo_products
    columns:
      - name: woo_product_id
        tests: [not_null]

  - name: stg_woo_customers
    columns:
      - name: woo_customer_id
        tests: [not_null]

  - name: stg_woo_refunds
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [site_code, woo_refund_id]
    columns:
      - name: woo_refund_id
        tests: [not_null]
      - name: woo_order_id
        tests: [not_null]

  - name: stg_woo_coupons
    columns:
      - name: woo_coupon_id
        tests: [unique, not_null]

  # ------------------------------------------------------------- core: dims
  - name: dim_date
    columns:
      - name: date_sk
        tests: [unique, not_null]
      - name: date_day
        tests: [unique, not_null]

  - name: dim_site
    columns:
      - name: site_sk
        tests: [unique, not_null]
      - name: site_code
        tests: [unique, not_null]

  - name: dim_country
    columns:
      - name: country_sk
        tests: [unique, not_null]
      - name: country_code
        tests: [unique, not_null]

  - name: dim_product
    columns:
      - name: product_sk
        tests: [unique, not_null]
      - name: site_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_site')
              field: site_sk

  - name: dim_customer_anonymized
    description: One row per customer_hash; no plaintext PII, no aggregate behavior.
    columns:
      - name: customer_sk
        tests: [unique, not_null]
      - name: customer_hash
        tests: [unique, not_null]

  - name: dim_payment_method
    columns:
      - name: payment_method_sk
        tests: [unique, not_null]
      - name: method_code
        tests: [unique, not_null]

  # ------------------------------------------------------------- core: facts
  - name: fact_order
    description: Order header fact. INVARIANT — no revenue_usd column here.
    columns:
      - name: order_sk
        tests: [unique, not_null]
      - name: order_natural_key
        tests: [unique, not_null]
      - name: site_sk
        tests:
          - not_null
          - relationships: { to: ref('dim_site'), field: site_sk }
      - name: date_sk
        tests:
          - not_null
          - relationships: { to: ref('dim_date'), field: date_sk }
      - name: customer_sk
        tests:
          - not_null
          - relationships: { to: ref('dim_customer_anonymized'), field: customer_sk }
      - name: country_sk
        tests:
          - not_null
          - relationships: { to: ref('dim_country'), field: country_sk }
      - name: payment_method_sk
        tests:
          - not_null
          - relationships: { to: ref('dim_payment_method'), field: payment_method_sk }
      - name: status
        tests:
          - accepted_values:
              values: [completed, processing, cancelled, failed, refunded, pending]
      - name: currency_source
        tests:
          - not_null
          - accepted_values:
              values: [USD, EUR, GBP, CAD]
      - name: fx_rate_to_usd
        tests: [not_null]
      - name: order_total_usd
        tests: [not_null]
      - name: payment_fee_source
        tests:
          - not_null
          - accepted_values:
              values: [api_exact, plugin_parser, seed_estimate, missing]

  - name: fact_order_item
    description: Line-item fact. INVARIANT — the single source of revenue.
    tests:
      - dbt_utils.expression_is_true:
          expression: "line_revenue_usd >= 0"
      - dbt_utils.expression_is_true:
          expression: "quantity > 0"
    columns:
      - name: order_item_sk
        tests: [unique, not_null]
      - name: order_sk
        tests:
          - not_null
          - relationships: { to: ref('fact_order'), field: order_sk }
      - name: site_sk
        tests:
          - not_null
          - relationships: { to: ref('dim_site'), field: site_sk }
      - name: date_sk
        tests:
          - not_null
          - relationships: { to: ref('dim_date'), field: date_sk }
      - name: product_sk
        tests:
          - not_null
          - relationships: { to: ref('dim_product'), field: product_sk }
      - name: quantity
        tests: [not_null]
      - name: fx_rate_to_usd
        tests: [not_null]
      - name: line_revenue_usd
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "line_revenue_usd is not null"
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: [completed, processing, cancelled, failed, refunded, pending]
      - name: is_revenue_status
        tests: [not_null]

  - name: fact_refund
    description: Refund fact, order-level grain (order_item_sk always NULL).
    tests:
      - dbt_utils.expression_is_true:
          expression: "refund_amount_usd >= 0"
    columns:
      - name: refund_sk
        tests: [unique, not_null]
      - name: order_sk
        tests:
          - not_null
          - relationships: { to: ref('fact_order'), field: order_sk }
      - name: date_sk
        tests:
          - not_null
          - relationships: { to: ref('dim_date'), field: date_sk }
      - name: refund_amount_usd
        tests: [not_null]
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: [refund, cancellation]

  # ------------------------------------------------------------- core: marts
  - name: mart_customer_summary
    description: Per-customer_hash behavioral summary; total_profit_usd NULL (Phase 3).
    columns:
      - name: customer_sk
        tests: [unique, not_null]
      - name: customer_hash
        tests: [unique, not_null]
      - name: total_orders
        tests: [not_null]
      - name: total_revenue_usd
        tests: [not_null]

  # ============================================================ Phase 3 — cost
  # ------------------------------------------------------- staging: manual cost
  - name: stg_manual_order_cost_enrichment
    description: Typed manual cost enrichment (order grain); no PII, money in *_src / already-USD.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [site_code, woo_order_id]
    columns:
      - name: site_code
        tests: [not_null]
      - name: woo_order_id
        tests: [not_null]
      - name: cost_source
        tests:
          - not_null
          - accepted_values:
              values: [manual_csv, supplier_api]
      - name: cost_allocation_method
        tests:
          - not_null
          - accepted_values:
              values: [line_exact, allocated_by_revenue_share, allocated_by_quantity_share, order_only]

  # -------------------------------------------------- operations: fact_order_cost
  - name: fact_order_cost
    description: Order-level cost enrichment (Phase 3). INVARIANT — no separate supplier-shipping cost field.
    tests:
      - dbt_utils.expression_is_true:
          expression: "cost_confidence between 0 and 1"
    columns:
      - name: order_cost_sk
        tests: [unique, not_null]
      - name: order_sk
        tests:
          - not_null
          - relationships: { to: ref('fact_order'), field: order_sk }
      - name: site_sk
        tests:
          - not_null
          - relationships: { to: ref('dim_site'), field: site_sk }
      - name: date_sk
        tests:
          - not_null
          - relationships: { to: ref('dim_date'), field: date_sk }
      - name: cost_source
        tests:
          - not_null
          - accepted_values:
              values: [manual_csv, supplier_api]
      - name: cost_allocation_method
        tests:
          - not_null
          - accepted_values:
              values: [line_exact, allocated_by_revenue_share, allocated_by_quantity_share, order_only]

  # ----------------------------------------------------- core: profit marts
  - name: mart_order_profit
    description: >
      Order-level contribution profit (net_revenue_usd − cogs − design_fee −
      payment_fee), where net_revenue_usd = gross_revenue_usd − effective_refund_usd
      and effective_refund_usd = LEAST(refunds_usd, gross_revenue_usd) (Woo refunds
      are full-order/shipping-inclusive, so the netting is capped at gross revenue
      and floors net at 0). revenue_usd is an alias of net_revenue_usd.
    columns:
      - name: order_sk
        tests:
          - unique
          - not_null
          - relationships: { to: ref('fact_order'), field: order_sk }
      - name: gross_revenue_usd
        description: SUM(fact_order_item.line_revenue_usd) filtered by is_revenue_status, PRE-refund.
        tests: [not_null]
      - name: refunds_usd
        description: SUM(fact_refund.refund_amount_usd) for this order (TRUE amount returned, incl. shipping); 0 when no refunds.
        tests: [not_null]
      - name: effective_refund_usd
        description: LEAST(refunds_usd, gross_revenue_usd) — portion of the refund applied to product revenue (capped at gross so net floors at 0).
        tests: [not_null]
      - name: net_revenue_usd
        description: gross_revenue_usd − effective_refund_usd; the basis for contribution_profit_usd. Floored at 0.
        tests: [not_null]
      - name: revenue_usd
        description: Alias of net_revenue_usd (kept so existing consumers of "revenue_usd" get NET).
        tests: [not_null]
      - name: payment_fee_source
        tests:
          - accepted_values:
              values: [api_exact, plugin_parser, seed_estimate, missing]
      - name: cost_allocation_method
        tests:
          - accepted_values:
              values: [line_exact, allocated_by_revenue_share, allocated_by_quantity_share, order_only]

  - name: mart_product_profit
    description: >
      Line-grain profit: cogs/design_fee/payment_fee/refunds allocated from
      mart_order_profit by revenue share. line_profit_usd sums exactly to the
      order's contribution_profit_usd across all lines of a revenue-bearing order.
    columns:
      - name: order_item_sk
        tests:
          - unique
          - not_null
          - relationships: { to: ref('fact_order_item'), field: order_item_sk }
      - name: order_sk
        tests:
          - not_null
          - relationships: { to: ref('fact_order'), field: order_sk }
      - name: line_net_revenue_usd
        description: line_revenue_usd minus this line's revenue-share of the order's effective_refund_usd (capped refund).
      - name: line_profit_usd
        description: line_net_revenue_usd − line_cogs_usd − line_design_fee_usd − line_payment_fee_usd.
      - name: cost_allocation_method
        tests:
          - accepted_values:
              values: [line_exact, allocated_by_revenue_share, allocated_by_quantity_share, order_only]

  - name: mart_country_profit
    description: Country × day profit roll-up.
    columns:
      - name: country_profit_sk
        tests: [unique, not_null]
      - name: country_sk
        tests:
          - not_null
          - relationships: { to: ref('dim_country'), field: country_sk }

  # -------------------------------------------------- reconciliation: coverage
  - name: recon_unmatched_csv_cost
    description: >
      FOS manual-sheet cost rows whose Order Code matches no Woo order (typo,
      deleted order, or not-yet-ingested) — dropped by fact_order_cost's INNER
      JOIN with no other signal. Investigate/fix at the source sheet.
    columns:
      - name: site_code
        tests: [not_null]
      - name: order_code
        tests: [not_null]
