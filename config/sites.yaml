sites:
  - site_code: FOS
    site_name: Fashion Open Studio
    # Storefront URL and credentials are resolved from the environment by *name*
    # so this committed config exposes no live endpoint and no secrets.
    base_url_env: WOO_FOS_BASE_URL
    key_env: WOO_FOS_KEY
    secret_env: WOO_FOS_SECRET
    default_currency: GBP
    supported_currencies:
      - USD
      - GBP
      - CAD
      - EUR
    # Verified from WordPress/WooCommerce settings: UTC+0.
    # Do not use Europe/London for FOS because it observes daylight saving time.
    timezone: UTC
    reporting_timezone: Asia/Bangkok
    is_active: true
